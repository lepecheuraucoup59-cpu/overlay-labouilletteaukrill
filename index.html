<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaBouilletteAuKrill · Overlay IRL</title>
<style>
:root{--blue:#168cff;--cyan:#57c5ff;--navy:rgba(4,15,29,.94);--white:#f4f8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif}
.overlay{position:relative;width:100vw;height:100vh;pointer-events:none}
.top{position:absolute;top:0;left:0;width:100%;height:94px;background:linear-gradient(110deg,rgba(3,15,29,.97),rgba(5,29,52,.94));border-bottom:3px solid var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;gap:18px;box-shadow:0 4px 18px #0007}
.brand{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100px;width:35%;background:linear-gradient(135deg,#061a30,#020b16);border:2px solid var(--blue);border-top:0;clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:5px 25px 10px}
.logo{font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic;font-weight:bold;font-size:clamp(20px,2.8vw,43px);white-space:nowrap;text-shadow:0 2px 8px #000}
.logo span{color:var(--blue)}
.sub{font-size:clamp(8px,.72vw,12px);letter-spacing:3px;margin-top:2px;font-weight:700}
.info{display:flex;align-items:center;gap:12px;min-width:25%;z-index:1}
.info.right{justify-content:flex-end}
.icon{font-size:30px;color:var(--blue);line-height:1}
.label{font-size:clamp(9px,.8vw,13px);color:var(--cyan);font-weight:800;letter-spacing:1px;text-transform:uppercase}
.value{font-size:clamp(12px,1.25vw,19px);font-weight:800;line-height:1.25}
.small{font-size:clamp(10px,.9vw,14px);font-weight:700;color:#d5e5f6}
.bottom{position:absolute;bottom:0;left:0;width:100%;height:70px;background:linear-gradient(100deg,rgba(3,15,29,.97),rgba(5,29,52,.92));border-top:3px solid var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;gap:15px}
.motto{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(16px,1.8vw,27px);font-style:italic;font-weight:bold}
.motto span{color:var(--blue)}
.live{border:1px solid var(--blue);border-radius:12px;padding:9px 15px;background:#06182c;display:flex;align-items:center;gap:12px;font-size:clamp(10px,.9vw,14px);font-weight:800}
.live b{color:var(--cyan);display:block;letter-spacing:1px}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;color:#fff;background:#06182caa;padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .5s}
.status.show{opacity:1}
@media(max-width:650px){.top{height:76px;padding:0 2%;gap:6px}.brand{height:80px;width:37%;padding:4px 14px}.logo{font-size:clamp(13px,3vw,22px)}.sub{letter-spacing:1px;font-size:7px}.info{gap:5px;min-width:27%}.icon{font-size:20px}.value{font-size:10px}.label{font-size:7px}.small{font-size:8px}.bottom{height:54px;padding:0 3%}.motto{font-size:15px}.live{padding:6px 8px;gap:6px}}
</style>
</head>
<body>
<div class="overlay">
 <header class="top">
  <div class="info">
   <div class="icon">⌖</div><div><div class="label">Position GPS</div><div class="value" id="place">Recherche du lieu…</div><div class="small" id="coords">GPS en attente</div></div>
  </div>
  <div class="brand"><div class="logo">LaBouilletteAu<span>Krill</span></div><div class="sub">PÊCHE AU COUP&nbsp; | &nbsp;IRL&nbsp; | &nbsp;TWITCH</div></div>
  <div class="info right">
   <div class="icon" id="weatherIcon">☀</div><div><div class="label">Météo locale</div><div class="value" id="weather">Chargement…</div><div class="small" id="temp">--°C · Vent -- km/h</div></div>
   <div style="width:1px;height:42px;background:#168cff;margin:0 8px"></div>
   <div class="icon">◷</div><div><div class="label">Heure locale</div><div class="value" id="clock">--:--:--</div><div class="small" id="date">--</div></div>
  </div>
 </header>
 <footer class="bottom">
  <div class="motto">Je vous emmène <span>à la pêche</span> avec moi</div>
  <div class="live"><span style="font-size:20px;color:#ff3c54">●</span><div><b>LIVE IRL</b>LABOUILLETTEAUKRILL</div></div>
 </footer>
 <div class="status" id="status"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function tick(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=n.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'});}
tick();setInterval(tick,1000);
const codes={0:['Ciel dégagé','☀'],1:['Peu nuageux','🌤'],2:['Partiellement nuageux','⛅'],3:['Couvert','☁'],45:['Brouillard','🌫'],48:['Brouillard givrant','🌫'],51:['Bruine légère','🌦'],53:['Bruine','🌦'],55:['Bruine forte','🌧'],61:['Pluie faible','🌦'],63:['Pluie','🌧'],65:['Pluie forte','🌧'],71:['Neige faible','🌨'],73:['Neige','🌨'],75:['Neige forte','❄'],80:['Averses faibles','🌦'],81:['Averses','🌧'],82:['Fortes averses','⛈'],95:['Orage','⛈'],96:['Orage et grêle','⛈'],99:['Orage violent','⛈']};
let lastLat=null,lastLon=null;
async function updateWeather(lat,lon){
 try{
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&timezone=auto`);
  if(!r.ok)throw new Error('Météo indisponible');const d=await r.json(),c=d.current,desc=codes[c.weather_code]||['Conditions variables','🌤'];
  $('weather').textContent=desc[0];$('weatherIcon').textContent=desc[1];$('temp').textContent=`${Math.round(c.temperature_2m)}°C · Vent ${Math.round(c.wind_speed_10m)} km/h`;
 }catch(e){$('weather').textContent='Météo indisponible';$('temp').textContent='Connexion nécessaire';}
}
async function reverse(lat,lon){
 try{
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=fr&format=json`);
  const d=await r.json(),x=d.results&&d.results[0];
  $('place').textContent=x?(x.name||x.city||x.locality||'Position GPS')+(x.admin1&&x.admin1!==x.name?', '+x.admin1:''):'Position GPS détectée';
 }catch(e){$('place').textContent='Position GPS détectée';}
}
function locate(){
 if(!navigator.geolocation){$('place').textContent='GPS non disponible';return;}
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude:lat,longitude:lon}=pos.coords;lastLat=lat;lastLon=lon;
  $('coords').textContent=`${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
  reverse(lat,lon);updateWeather(lat,lon);
 },err=>{$('place').textContent='Autoriser la position GPS';$('coords').textContent='Ouvrir via une page HTTPS et autoriser la localisation';$('weather').textContent='GPS requis';$('temp').textContent='';},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
locate();setInterval(()=>{if(lastLat!==null)updateWeather(lastLat,lastLon);else locate();},10*60*1000);
</script>
</body>
</html>
